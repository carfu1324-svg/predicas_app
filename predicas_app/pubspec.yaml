name: predicas_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Dependencias agregadas
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  flutter_markdown: ^0.7.3+1
  flutter_widget_from_html: ^0.15.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/predicas.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/Predica_icon.png"   # tu PNG de 1024x1024
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"